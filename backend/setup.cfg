[flake8]
# Backend lint configuration for quizthespire.com
#
# Legacy debt note: `app.py` is the ~10k-line FastAPI monolith that the Go
# migration (backend-go/) is replacing. It accumulates violations every time
# it's touched, so rather than hiding them quietly we keep them in the
# per-file-ignore below with this comment as the visible record. Everything
# NEW (backend/api, backend/database, etc.) is linted strictly.
max-line-length = 120
extend-ignore =
    E203,
    E501,
    E402,
    W503,
    W504,
    W291,
    W293,
    F541,
per-file-ignores =
    app.py: F821,F401,F811,F824,E302,E303,F841
    api/routers/ip_management.py: F821
    models/models.py: F811,F821
    database/datarepository.py: F811
    database/manage_repository.py: F811
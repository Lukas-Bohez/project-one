name: Stock Prediction Lab - Daily Predictions

on:
  schedule:
    - cron: '30 21 * * 1-5' # 21:30 UTC = after US market close, weekdays only
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-predictions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas scikit-learn numpy

      - name: Generate daily predictions
        run: python scripts/stock-lab/generate_predictions.py

      - name: Commit and push results
        run: |
          git config user.name "stock-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/data/stock-lab/predictions.json frontend/data/stock-lab/scoreboard.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update stock predictions for $(date +%Y-%m-%d)"
          git push
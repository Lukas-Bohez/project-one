<body class="theme-dark">

<a href="#main-content" class="av-skip-link">Skip to main content</a>

<header class="av-header">
  <div class="av-header__inner">
    <a href="/" class="av-logo" aria-label="Back to Quiz The Spire">
      <span class="av-logo__icon"><i class="fa-solid fa-crown"></i></span>
      <span class="av-logo__text">Quiz The Spire</span>
    </a>
    <div class="av-header__nav">
      <button id="themeToggleBtn" class="av-header__btn" aria-label="Toggle dark mode">
        <i class="fa-solid fa-circle-half-stroke"></i>
      </button>
    </div>
  </div>
</header>

<main id="main-content">
  <section class="av-panel av-panel--active">
    <div class="av-studio-layout">
      <div class="av-studio-timeline">
        <h2 class="av-section-title">Timeline Dubbing</h2>
        <p class="av-section-desc">Type your monologue as blocks on a timeline. Preview with browser speech, drag blocks on the preview bar to place them, then capture the result with OBS.</p>
        <div class="av-timeline-toolbar">
          <button id="addBlockBtn" class="av-btn av-btn--primary">
            <i class="fa-solid fa-plus"></i> Add Block
          </button>
          <label class="av-btn av-btn--outline" style="cursor:pointer">
            <i class="fa-solid fa-file-import"></i> Import SRT
            <input type="file" id="importSrtInput" accept=".srt" style="display:none">
          </label>
          <span class="av-timeline-stats" id="timelineStats">
            <span class="av-stat"><span id="blockCount">0</span> blocks</span>
            <span class="av-stat"><span id="totalDuration">0.0</span>s total</span>
          </span>
        </div>
        <div class="av-timeline-canvas-wrap" id="timelineCanvasWrap">
          <canvas id="timelineCanvas" class="av-timeline-canvas"></canvas>
          <div class="av-timeline-empty" id="timelineEmpty">
            <i class="fa-solid fa-timeline"></i>
            <p>No blocks yet. Add a text block to start building your dub.</p>
          </div>
        </div>
      </div>
      <div class="av-studio-blocks" id="studioBlocks"></div>
      <div class="av-studio-actions">
        <button id="playSequenceBtn" class="av-btn av-btn--primary av-btn--lg" disabled>
          <i class="fa-solid fa-play"></i> Preview from playhead
        </button>
        <button id="exportSrtBtn" class="av-btn av-btn--outline" disabled>
          <i class="fa-solid fa-closed-captioning"></i> Export .SRT
        </button>
      </div>
    </div>
  </section>
</main>

<template id="studioBlockTemplate">
  <div class="av-studio-block">
    <div class="av-studio-block__header">
      <span class="av-studio-block__number"></span>
      <input type="text" class="av-studio-block__text av-input" placeholder="Enter text to speak..." aria-label="Block text">
      <label class="av-studio-block__time-label">
        Start at
        <input type="number" class="av-studio-block__time av-input av-input--sm" value="0.0" step="0.1" min="0" aria-label="Start time in seconds">
        s
      </label>
      <span class="av-studio-block__duration" aria-label="Duration">—</span>
      <button class="av-studio-block__preview av-btn av-btn--ghost av-btn--sm" aria-label="Preview this block with speech">
        <i class="fa-solid fa-play"></i>
      </button>
      <button class="av-studio-block__delete av-btn av-btn--ghost av-btn--sm" aria-label="Remove this block">
        <i class="fa-solid fa-trash"></i>
      </button>
    </div>
  </div>
</template>

<script src="avatar-studio.js"></script>
</body>
</html>

<IfModule mod_ssl.c>
<VirtualHost *:443>
            ServerName quizthespire.com
    ServerAlias www.quizthespire.com localhost

    Protocols h2 http/1.1

    # Security headers
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://pagead2.googlesyndication.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https:; connect-src 'self' https://www.google-analytics.com https://pagead2.googlesyndication.com; frame-ancestors 'none'"

    # Main site root - serves index.html at https://quizthespire.com/
    DocumentRoot /home/student/Project/project-one/frontend

    <Directory /home/student/Project/project-one/frontend>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Static portfolio served from exported build output
    RedirectMatch 301 ^/LukasBohez$ /LukasBohez/
    RedirectMatch 301 ^/portfolio$ /LukasBohez/
    RedirectMatch 301 ^/portfolio/(.*)$ /LukasBohez/$1
    Alias /LukasBohez /home/student/Project/project-one/frontend/portfolio/out

    <Directory /home/student/Project/project-one/frontend/portfolio/out>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Backend proxy (FastAPI + Socket.IO) served by systemd service on :8001
    ProxyPreserveHost On
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/socket.io/(.*) ws://127.0.0.1:8001/socket.io/$1 [P,L]

    # Go backend (:8081) serves the high-traffic read endpoints
    ProxyPass /api/v1/questions http://127.0.0.1:8081/api/v1/questions
    ProxyPassReverse /api/v1/questions http://127.0.0.1:8081/api/v1/questions
    ProxyPass /api/v1/answers http://127.0.0.1:8081/api/v1/answers
    ProxyPassReverse /api/v1/answers http://127.0.0.1:8081/api/v1/answers
    ProxyPass /api/v1/themes http://127.0.0.1:8081/api/v1/themes
    ProxyPassReverse /api/v1/themes http://127.0.0.1:8081/api/v1/themes

    # Squad finder: in-memory WebSocket + API on the Go backend (:8081).
    # These MUST come before the generic /api -> Python (:8001) catch-all.
    ProxyPass /api/v1/squad/ws ws://127.0.0.1:8081/api/v1/squad/ws
    ProxyPassReverse /api/v1/squad/ws ws://127.0.0.1:8081/api/v1/squad/ws
    ProxyPass /api/v1/squad http://127.0.0.1:8081/api/v1/squad
    ProxyPassReverse /api/v1/squad http://127.0.0.1:8081/api/v1/squad

    ProxyPass /api http://127.0.0.1:8001/api
    ProxyPassReverse /api http://127.0.0.1:8001/api

    ProxyPass /socket.io http://127.0.0.1:8001/socket.io
    ProxyPassReverse /socket.io http://127.0.0.1:8001/socket.io

                SSLEngine on
    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/quizthespire.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/quizthespire.com/privkey.pem

    ErrorLog ${APACHE_LOG_DIR}/quizthespire-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/quizthespire-ssl-access.log combined
</VirtualHost>
</IfModule>
